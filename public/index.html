<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kisaanu Nexus — Farm Management Web App</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #121A14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    
    /* Device Frame Simulation for Desktop Web */
    #app-root {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 900px;
      background-color: #F5F7F5;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border-radius: 36px;
      overflow: hidden;
      position: relative;
    }

    @media (max-width: 500px) {
      #app-root {
        max-width: 100%;
        max-height: 100%;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div id="app-root"></div>
</body>
</html>
